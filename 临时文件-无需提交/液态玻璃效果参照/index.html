<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <main class="login-wrapper">
    <section class="glass-card" aria-label="登录卡片">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 3 7l9 5 9-5-9-5z"/>
            <path d="M3 17l9 5 9-5"/>
            <path d="M3 12l9 5 9-5"/>
          </svg>
        </div>
        <h1>欢迎回来</h1>
        <p>登录您的账户以继续</p>
      </div>

      <form class="login-form" onsubmit="event.preventDefault();">
        <label class="field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" placeholder="用户名或邮箱" autocomplete="username" />
        </label>

        <label class="field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" placeholder="密码" autocomplete="current-password" />
        </label>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" />
            <span class="checkbox-visual"></span>
            <span>记住我</span>
          </label>
          <a href="#" class="link">忘记密码?</a>
        </div>

        <button type="submit" class="btn-primary">登 录</button>

        <div class="divider"><span>或使用以下方式登录</span></div>

        <div class="socials">
          <button type="button" class="social" aria-label="Google 登录">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3.3 14.7 2.3 12 2.3 6.9 2.3 2.8 6.4 2.8 11.5S6.9 20.7 12 20.7c6.9 0 9.3-4.9 9.3-7.9 0-.5 0-1-.1-1.5H12z"/></svg>
          </button>
          <button type="button" class="social" aria-label="GitHub 登录">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 .5C5.73.5.75 5.48.75 11.75c0 4.96 3.22 9.17 7.69 10.66.56.1.77-.24.77-.54 0-.27-.01-1.16-.02-2.1-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.94.1-.73.39-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.57 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.65 0c2.15-1.45 3.1-1.15 3.1-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.33-2.63 5.29-5.14 5.57.4.34.76 1.02.76 2.07 0 1.5-.01 2.71-.01 3.07 0 .3.2.65.78.54 4.47-1.49 7.69-5.7 7.69-10.66C23.25 5.48 18.27.5 12 .5z"/></svg>
          </button>
          <button type="button" class="social" aria-label="Apple 登录">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16.36 12.72c-.02-2.3 1.88-3.4 1.97-3.46-1.07-1.57-2.75-1.78-3.35-1.81-1.43-.14-2.79.84-3.51.84-.73 0-1.85-.82-3.04-.8-1.56.02-3 .91-3.8 2.3-1.62 2.8-.41 6.95 1.17 9.22.77 1.11 1.69 2.36 2.9 2.31 1.17-.05 1.62-.75 3.03-.75 1.41 0 1.81.75 3.04.73 1.26-.02 2.06-1.13 2.83-2.25.89-1.29 1.26-2.54 1.28-2.6-.03-.01-2.45-.94-2.47-3.73zM14.12 5.8c.64-.78 1.08-1.86.96-2.94-.93.04-2.06.62-2.72 1.39-.59.69-1.11 1.8-.97 2.85 1.04.08 2.1-.52 2.73-1.3z"/></svg>
          </button>
        </div>

        <p class="signup">还没有账户? <a href="#" class="link">立即注册</a></p>
      </form>
    </section>
  </main>
</body>
</html>
